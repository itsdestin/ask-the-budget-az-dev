[project]
name = "ask-the-budget-az-dev"
version = "0.1.0"
description = "Ask the Budget AZ — workspace repo: docs, plans, specs, ingest tooling"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "mineru[pipeline]>=3.1.6",
    "opendataloader-pdf>=2.4.1",
    "python-docx>=1.2.0",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "beautifulsoup4>=4.14.0",
    "rapidfuzz>=3.10.0",
    # torch + torchvision pinned as direct deps so [tool.uv.sources] below
    # routes them to the PyTorch CUDA index. Without this, uv treats them
    # as transitive (via mineru[pipeline]) and pulls the PyPI CPU wheel.
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    # Phase 1b WS1: Postgres client + pgvector type registration.
    # psycopg[binary] = libpq bundled wheel, no separate libpq install needed on Windows.
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # Phase 1b WS3: Voyage embeddings (voyage-3-large, 1024 dim) + Phase 1b WS6 reranker (rerank-2.5).
    # Single SDK provides both.
    "voyageai>=0.3.4",
    # Phase 1c WS1: FastAPI sidecar (retrieval/api.py) — exposes the Python
    # retrieve() pipeline over localhost HTTP so the Node MCP server can call
    # it without per-call subprocess cold-start. uvicorn[standard] pulls in
    # uvloop / httptools where available for snappier loop performance.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Phase 1c dogfood-hardening (2026-05-20): load .env.local on
    # sidecar startup so VOYAGE_API_KEY doesn't have to be re-exported
    # in every shell that runs `uv run uvicorn`. Reading via load_dotenv
    # also short-circuits the "user forgot to source the env file"
    # failure mode that bricked an entire dogfood session.
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.10.2",
    "pytest>=9.0.3",
    # FastAPI's TestClient is built on httpx; pinned explicitly so the
    # retrieval sidecar tests don't depend on whatever version FastAPI
    # transitively brings in.
    "httpx>=0.27",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that fetch from the live JLBC URLs via the download cache",
]

# PyTorch CUDA wheels for Nvidia GPU acceleration.
#
# MinerU's pipeline backend uses torch + transformers under the hood; with the
# default CPU torch wheel it runs ~2-3 min/page on real PDFs. Pulling the CUDA
# 12.4 build of torch makes it run on the GPU instead — order-of-magnitude
# speedup on table-heavy pages.
#
# Driver 591.74 (CUDA 13.1) on this dev box. cu128 chosen because torch 2.11
# (which mineru[pipeline]>=3.1.6 requires) only publishes CUDA wheels for
# cu128 and newer — cu124 maxes out at torch 2.6.0. Verify with
# `python -c "import torch; print(torch.cuda.is_available())"` after
# `uv sync` — must return True.

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
