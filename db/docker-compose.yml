# Local Postgres + pgvector + ParadeDB pg_search for Phase 1b dev.
#
# ParadeDB ships an official image bundling Postgres 16 + pgvector + pg_search
# pre-installed — saves us building extensions from source. Pinned to a specific
# version so a tag-rollover upstream doesn't break the dev loop.
#
# To start:        docker compose up -d
# To wipe + reset: docker compose down -v   (also removes ./data/)
# To psql in:      docker compose exec postgres psql -U askbudget askbudget

services:
  postgres:
    image: paradedb/paradedb:0.23.4-pg16
    container_name: askbudget-postgres
    environment:
      POSTGRES_DB: askbudget
      POSTGRES_USER: askbudget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askbudget-dev}
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      # Bind to 127.0.0.1 only — never expose Postgres to the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askbudget -d askbudget"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
