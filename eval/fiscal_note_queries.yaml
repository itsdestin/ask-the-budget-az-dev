# Comparison-shaped: the coordinator often needs the same topic across sessions
# to see whether an estimate moved.
- id: fn-same-topic-across-sessions
  type: comparison
  query: fiscal notes on the same tax credit analyzed in more than one session
  ground_truth: {}

# Refusal: the corpus holds fiscal notes only. A question about something it
# cannot possibly contain must score below the refusal threshold rather than
# returning a confident near-miss.
- id: fn-refusal-out-of-corpus
  type: refusal
  query: what is the federal debt ceiling schedule for the next decade
  ground_truth: {}
