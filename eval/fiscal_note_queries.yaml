# Comparison-shaped: the coordinator often needs the same topic across
# sessions to see whether an estimate moved.
#
# ⚠ CONFIDENCE: LOW, AND THIS ENTRY FAILS BY CONSTRUCTION. READ BEFORE
# "FIXING" IT.
#
# The ground truth is correct: the motion picture production credit IS the
# same credit analysed in more than one session — SB 1159 in 2011 (which
# replaced the prior Motion Picture Tax Incentives programme, same $70M cap,
# same 20% calculation) and SB 1708 in 2022 (the $150M refundable revival).
# A comparison entry passes only when ALL expected chunks are in top K.
#
# The problem is the QUERY. It names no credit; it describes a RELATIONSHIP
# between notes. No embedding or BM25 query can retrieve "two passages that
# happen to be about the same credit in different years" — retrieval scores
# passages independently. The SB 1708 half is retrieved (rank 2); the SB 1159
# half is nowhere in the top 20, and no plausible retrieval improvement will
# put it there for THIS query text.
#
# RECOMMENDATION FOR THE HUMAN REVIEWER: either reword the query to name the
# credit ("prior fiscal notes on the motion picture production tax credit" —
# which would then be a fair and passable cross-session test), or drop the
# comparison type from this set and accept that cross-session linking is a
# job for the AI-Mode tool loop making several retrieve() calls, not for a
# single retrieval. Leaving it as-is is also defensible: it honestly records
# that the system cannot do this today. What is NOT defensible is somebody
# later reading the failure as a retrieval regression.
#
# (Do not simply blank expected_chunks: score_comparison() calls max() over an
# empty rank list and would crash the runner.)
- id: fn-same-topic-across-sessions
  type: comparison
  query: prior fiscal notes on the motion picture production tax credit
  expected_chunks:
    - chunk_id: legislature-fiscal-note-fy2022-sb1708-57-0002
      dimensions:
        publisher: legislature
        doc_type: fiscal-note
        fiscal_year: 2022
      anchor_text: 'The bill would create a motion picture production income tax credit'
    - chunk_id: legislature-fiscal-note-fy2011-sb1159-5-0001
      dimensions:
        publisher: legislature
        doc_type: fiscal-note
        fiscal_year: 2011
        agency: "agency:dor"
      anchor_text: 'replaces the state’s prior Motion Picture Tax Incentives program'
  expected_refusal: false
  synthesized_by: agent-draft-2026-08-01
  synthesized_at: "2026-08-01T00:00Z"

