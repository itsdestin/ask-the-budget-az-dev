# Eval query set for JLBC Search Layer 1 retrieval eval.
#
# 47 queries: 37 lookup + 5 comparison + 5 refusal.
#
#   q-001 .. q-034  the original seed set, generated 2026-05-21 via
#                   subagent-driven synthesis (the synthesize_queries.py
#                   CLI requires an Anthropic API key not present in
#                   .env.local at generation time).
#   n-001 .. n-013  NO-YEAR queries with pre-FY2025 ground truth,
#                   hand-authored 2026-08-01. See the block below —
#                   they exist to fix a structural blindness in the
#                   original set, and they are read differently.
#
#
# ============================================================================
# THE n-* BLOCK: WHY IT EXISTS AND WHAT IT MEASURES
# ============================================================================
#
# Every one of q-001..q-029 names a fiscal year (32 of the 34 entries
# do), so `retrieval.query_year.parse_query_years` returns a year,
# S21 layer 1 turns that into a HARD fiscal-year filter, and the
# layer-3 recency boost in `retrieval/recency.py` is SKIPPED. The other
# two are refusal queries with no ground truth to recall.
#
# So before 2026-08-01, ZERO queries in this file executed the recency
# code path. That was not a harmless gap. The 13-weight sweep that
# chose RECENCY_BOOST_PER_YEAR = 2.064 produced a perfectly FLAT recall
# column for this set at every weight, which reads like proof the boost
# is free and is proof of nothing at all — the set never ran the code.
#
# Second, related gap: every ground-truth chunk in q-001..q-029 is
# FY2025 (9), FY2026 (12) or FY2027 (13). Nothing older. A recency
# boost HELPS a recent target, so even the sweep's year-stripped proxy
# column was optimistic by construction: it could not measure harm to
# an OLD target because it had none to point at.
#
# The n-* entries close both gaps at once. Each one:
#
#   * names no fiscal year — `parse_query_years(query) == []`, verified
#     mechanically, not by eye. If a future edit puts a year in one of
#     these questions the entry silently stops measuring anything while
#     still producing a plausible-looking number, which is exactly the
#     failure this block exists to end.
#   * has ground truth in FY2022, FY2023 or FY2024, so a ranking change
#     that buries old material shows up here as lost recall.
#
# HOW THESE WERE AUTHORED (same discipline as eval/queries_historical.yaml)
# ------------------------------------------------------------------------
# Hand-authored against the live corpus on 2026-08-01 (28,530 budget
# chunks / 1,429 documents). For every entry:
#
#   * the chunk_id was confirmed to EXIST in `budget_chunks`
#   * the FULL chunk text was read and confirmed to answer the question
#   * the anchor_text is a LITERAL substring of that chunk's `text`
#   * publisher / doc_type / fiscal_year / agency were read off the row
#   * the query was run through the real pipeline
#     (`retrieve(RetrievalRequest(query=..., corpus="budget_chunks",
#     top_k=20))`) at the SHIPPED weight, and the rank it landed at is
#     recorded in each entry's comment
#
# Nothing here was invented. Candidate questions whose honest answer was
# the NEWEST edition were dropped rather than pointed at an old chunk —
# "what is the Basic State Aid deferral" is correctly answered by FY2027,
# and pinning it to FY2024 would have manufactured a fake regression.
#
# WHY THE QUESTIONS LOOK LIKE THIS
# --------------------------------
# An undated question only has an old answer when the thing asked about
# happened once, in an old cycle: the pandemic-era discretionary
# allocations, Proposition 208's court defeat, the Florence prison
# closure plan, a line-item veto, a one-time pilot appropriation. Those
# are real analyst questions AND they have exactly one correct edition.
# That is the shape to copy when extending this block.
#
# NO AGAO AFR ENTRIES, DELIBERATELY. The AFRs are near-identical fund
# tables edition over edition, so an undated question about a fund is
# legitimately answered by the newest AFR. Pointing one at FY2022 would
# have been ground truth invented to fail.
#
# WHAT A FAILURE HERE MEANS
# -------------------------
# NOT automatically a bug. These queries put old and new editions in
# the same result set, which is the one situation where the recency
# boost bites: `anchor_fiscal_year` is the newest fiscal year IN THE
# RESULT SET, so a query whose hits are all FY2022 takes no penalty at
# all, while a query that surfaces one FY2027 chunk penalises an FY2022
# target by 5 * 2.064 = 10.3 on a roughly -10..10 logit scale. Read a
# failure as a measurement of that trade, and re-tune the weight, not
# the query.
#
# IMPORTANT: This is a Layer 1 regression detector, not a usefulness
# measure. Lookup/comparison queries were synthesized FROM chunks —
# by construction, the chunk IS the correct answer. The 86% recall@5
# baseline is an UPPER BOUND, not representative of real analyst
# usage. Trust deltas across runs, not absolute numbers. See
# eval/README.md for the full caveat.
#
# Refusal queries (q-030 through q-034) test only corpus-boundary
# cases (wrong jurisdiction, fictional entity, future FY). They do
# NOT test editorial framing — "should we raise taxes" type questions
# legitimately retrieve relevant chunks; the editorial framing should
# be declined at the LLM layer, not at retrieval. q-030 and q-031
# straddle this line and are kept for transparency, but their
# "failure" to be refused at the retrieval threshold isn't a
# retrieval bug.
#
# Each lookup/comparison entry points at a real chunk in the live
# corpus and carries an anchor_text verbatim-copied from that chunk
# so the refresh tool can re-bind the entry after a re-chunk.
# Refusal entries have expected_chunks=[] and expected_refusal=true.

- id: q-001
  query: What is Arizona's FY 2026 employer contribution rate for the Elected Officials Retirement Plan, and what portion of it goes toward paying down unfunded liability?
  type: lookup
  expected_chunks:
    # Re-pointed 2026-08-16: this document's id said "baseline" while its own
    # source_url is /26AR/ (the Appropriations Report). It was one of 22 such
    # contradictions, and a colliding id silently REPLACES a document on a
    # from-scratch rebuild. Verified against this entry's own anchor_text at
    # the new id before the change landed -- `eval/refresh_chunk_ids.py` was
    # deleted and anchor_text is the surviving repair path.
    - chunk_id: jlbc-approps-fy2026-crr-0013
      dimensions:
        publisher: jlbc
        doc_type: topic-pdf
        fiscal_year: 2026
      anchor_text: "FY 2026 EORP employer contribution rate is 70.70%"
  expected_refusal: false
  synthesized_by: claude-opus-4-7
  synthesized_at: "2026-05-21T00:00Z"

