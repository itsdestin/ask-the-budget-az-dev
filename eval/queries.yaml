# Eval query set for Ask the Budget AZ retrieval harness.
#
# 34 queries: 24 lookup + 5 comparison + 5 refusal.
# First seed set generated 2026-05-21 via a subagent-driven session
# (the synthesize_queries.py CLI requires an Anthropic API key in
# .env.local; was not configured at generation time).
#
# Each lookup/comparison entry points at a real chunk in the live
# corpus and carries an anchor_text verbatim-copied from that chunk
# so the refresh tool can re-bind the entry after a re-chunk.
# Refusal entries have expected_chunks=[] and expected_refusal=true.

