# Explicit-year query set (spec S21 layer 1, Phase D). AUTHORED 2026-08-01.
#
# This file was a placeholder until now. Its old header said "EMPTY ON
# PURPOSE" and described a ~16-entry file holding TWO groups: explicit-year
# queries and no-year current-intent queries. That plan changed. Read the
# next two sections before touching anything.
#
#
# WHAT IS IN HERE
# ---------------
# Ten EXPLICIT-YEAR queries. Every one names a fiscal year, so
# `retrieval.query_year.parse_query_years` returns a year for it, S21
# layer 1 turns that into a HARD fiscal-year filter, and the layer-3
# recency boost is SKIPPED entirely.
#
# That is the whole point of the file. These queries are immune to the
# recency boost BY DESIGN, and this set is what proves the immunity holds.
# Their recall must be INVARIANT across the entire
# `RECENCY_BOOST_PER_YEAR` sweep. If a number in here moves when the
# weight moves, the skip-the-boost-when-a-year-filter-is-active rule is
# broken — that is a code defect in `retrieval/`, not a signal that the
# weight is too high, and the sweep must refuse to recommend anything
# until it is fixed.
#
#
# WHAT IS *NOT* IN HERE ANY MORE — READ THIS IF YOU MAINTAIN calibrate_recency.py
# ------------------------------------------------------------------------------
# The old header promised a second group in this same file: ~6 NO-YEAR
# current-intent queries whose ground truth was the newest edition's
# chunk, which `eval/calibrate_recency.py` splits out by running the year
# parser. Those queries now live in **eval/queries_recency.yaml** and they
# are a DIFFERENT SHAPE — no `expected_chunks` at all, because their
# ground truth turned out not to be a chunk.
#
# Why the shape changed: the requirement Destin actually stated on
# 2026-08-01 is about ORDER, not membership. For a bare agency name, the
# editions should come back roughly newest-first. A chunk-recall entry
# cannot express that — a run can recall the FY2027 chunk at rank 9,
# score a pass, and still show the analyst FY2023 at the top. So the
# no-year group became an ordering set with its own scorer.
#
# CONSEQUENCE: `eval/calibrate_recency.py` as written expects to find both
# groups here and to split them with the year parser. Pointed at this
# file today it will find ten historical entries and ZERO no-year ones,
# so its `no_year` set is empty. Its parser-based split is still the right
# idea and should be kept as the guard that nothing year-named sneaks in
# here — but the `no_year` half of the sweep must now read
# eval/queries_recency.yaml through that file's ordering metric. That
# wiring is the scorer's job, not this file's.
#
#
# SCHEMA
# ------
# Identical to eval/queries.yaml — id / query / type / expected_chunks
# [{chunk_id, dimensions{publisher, doc_type, fiscal_year, agency},
# anchor_text}] / expected_refusal. Validated by `eval.schema.EvalQuery`,
# whose `type` is a Literal of lookup | comparison | refusal, so every
# entry here is `lookup`.
#
# NO REFUSAL ENTRIES. The sweep scores recall, and a refusal query has no
# chunk to recall.
#
#
# HOW THESE WERE AUTHORED, AND WHAT WAS VERIFIED
# ----------------------------------------------
# Hand-authored against the live corpus, not synthesized. For every entry,
# on 2026-08-01 against a 28,530-chunk / 1,429-document corpus:
#
#   * the chunk_id was confirmed to EXIST in `budget_chunks`
#   * the anchor_text was confirmed to be a LITERAL substring of that
#     chunk's `text` (byte-for-byte, `anchor in chunk.text`)
#   * the dimensions were read off the row, not guessed
#   * the query was run through the real pipeline
#     (`retrieve(RetrievalRequest(query=..., corpus="budget_chunks",
#     top_k=20))`) and the target chunk was confirmed present, at the rank
#     recorded in each entry's comment. Every one lands in the top 5 today
#   * `parse_query_years(query)` was confirmed NON-EMPTY, so layer 1
#     really does filter and the entry really is testing immunity
#
# Nothing in this file was invented. A candidate query with no genuine
# answer in the corpus was dropped rather than pointed at an approximate
# chunk.
#
#
# YEAR FORMS ARE VARIED ON PURPOSE
# --------------------------------
# `retrieval/query_year.py` parses several shapes and rejects several
# look-alikes, and a set that only ever wrote "FY 2023" would exercise one
# branch. Covered here: spaced four-digit ("FY 2022"), unspaced
# four-digit ("FY2024"), bare four-digit ("2023", "2024"), and two-digit
# with an fy prefix ("fy23", "fy25").
#
#
# THE OLDER ENTRIES ARE THE VALUABLE ONES
# ---------------------------------------
# FIVE of the ten (h-001 … h-005) target FY2022 or FY2023 documents, where
# the correct answer is genuinely an OLD edition. Those are the entries a
# too-aggressive recency boost would break if the skip rule ever regressed
# — a weight large enough to reorder by date would push a FY2022 page
# below several FY2026/27 near-duplicates of itself. They are marked
# `# GUARD:` individually.
#
#
# CORPUS SCOPE AT AUTHORING TIME — do not extend past it
# -----------------------------------------------------
# JLBC Baselines FY2022-2027 and Appropriations Reports FY2022-2026 (11
# editions, ~1,420 per-agency documents), plus 3 AGAO AFRs, 3 Governor's
# Executive Budgets and 1 budget bill. **Pre-FY2022 editions (27 more) are
# deliberately deferred.** Do NOT add queries assuming FY1984-FY2021
# documents exist; there are 169 FY2021-stamped chunks in the corpus and
# no FY2021 edition behind them. When the older editions land, THAT is the
# moment to add "fy2014 ADC private prison per diem"-shaped entries — and
# the moment to re-verify these ten, because a wider corpus changes what
# competes with them inside the +/-1 year window.
#
#
# ONE THING THAT WILL LOOK WRONG AND IS NOT
# -----------------------------------------
# h-008 names fy25 and its ground-truth chunk carries `fiscal_year: 2026`.
# That is `ADJACENT_YEAR_WINDOW = 1` in retrieval/query_year.py working as
# designed: a chunk's fiscal_year is the DOCUMENT's year, not the year the
# passage is about, and an FY2025 supplemental appropriation is enacted in
# the 2025 session's bill, which IS the FY2026 budget bill. The entry is
# kept precisely because it exercises that window.
#
# AFTER ANY SWEEP: re-run eval/calibrate_refusal.py. A non-zero boost
# lowers `top_score`, and `top_score` is what
# `harness.constants.REFUSAL_THRESHOLD` is compared against.

# GUARD: correct answer is a FY2022 document. Target at rank 1/20 on 2026-08-01.
- id: h-001
  query: FY 2022 Department of Child Safety caseworker funding
  type: lookup
  expected_chunks:
    - chunk_id: jlbc-baseline-fy2022-dcs-0023
      dimensions:
        publisher: jlbc
        doc_type: baseline-per-agency
        fiscal_year: 2022
        agency: "agency:dcs"
      anchor_text: "and 1,406 FTE Positions in FY 2022 for caseworkers"
  expected_refusal: false
  synthesized_by: hand-authored-phase-d
  synthesized_at: "2026-08-01T00:00Z"

