# Notes for the catalog rebuild
maintenance:
  source_files: "samples/raw-pdfs/jlbc-{baseline,approps}-fy{YYYY}-agency-index.pdf"
  rebuild_command: "uv run python scripts/build_agency_catalog.py"
  related: "samples/entity-catalog.yaml — full canonical agency catalog"
  pending_for_phase_1:
    - "Manual review of 'eliminated_or_merged' notes — confirm fate of each via JLBC narrative."
    - "Resolve doa-cfs / doa-csf / doa-sfd / sfb identity — likely all the same logical entity but JLBC churned through several slug forms."
    - "Verify ban → dif merger inference."
    - "Check approps-fy2015 hosting URL path for further history (`http://www.azleg.gov/jlbc/15AR/...`); pre-FY15 may exist at older paths."
